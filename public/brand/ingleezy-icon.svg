<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ingleezy">
  <!--
    The Ingleezy mark.

    Two speech bubbles that overlap, tails pointing opposite ways: one down and
    to the left for English, one down and to the right for Arabic. The app in
    one shape. Where the two overlap the colour deepens, which is the point of
    the whole product: the two languages are not side by side, they are on top
    of each other.

    The tails are what make it a conversation rather than a stack of cards, so
    they are drawn long and wide enough to survive being rasterised to 16px by
    scripts/render-brand-icons.mjs. Check any edit at that size before shipping
    it; a tail that reads at 512 can vanish at 16.

    What this replaces: a white circle holding an exclamation mark, which read
    as an error badge at every size, and whose one meaningful detail (a hamza
    standing in for the dot) was invisible below about 64px.

    Three flat fills and no gradients. This file is the favicon, and a gradient
    at 16px is just mud. The colours are Gold (#E8A93A), Plum (#4A1D45) and the
    overlap (#2B0F28), matching the accent, primary and olive tokens in
    src/index.css.

    Keep comment text free of doubled hyphens, which XML forbids inside a
    comment: browsers parse this file as XML when it is loaded through an img
    tag, and one stray pair makes the whole logo fail to render.
  -->
  <defs>
    <clipPath id="ingleezy-english">
      <path d="M112 56 H248 A56 56 0 0 1 304 112 V208 A56 56 0 0 1 248 264 H112 A56 56 0 0 1 56 208 V112 A56 56 0 0 1 112 56 Z M104 250 L54 336 L150 250 Z"/>
    </clipPath>
  </defs>

  <!-- English bubble, tail down and to the left. -->
  <path fill="#E8A83B" d="M112 56 H248 A56 56 0 0 1 304 112 V208 A56 56 0 0 1 248 264 H112 A56 56 0 0 1 56 208 V112 A56 56 0 0 1 112 56 Z M104 250 L54 336 L150 250 Z"/>

  <!-- Arabic bubble, tail down and to the right. -->
  <path fill="#491D45" d="M264 192 H400 A56 56 0 0 1 456 248 V344 A56 56 0 0 1 400 400 H264 A56 56 0 0 1 208 344 V248 A56 56 0 0 1 264 192 Z M362 386 L412 472 L316 386 Z"/>

  <!-- Where they overlap. -->
  <g clip-path="url(#ingleezy-english)">
    <path fill="#2F0E2C" d="M264 192 H400 A56 56 0 0 1 456 248 V344 A56 56 0 0 1 400 400 H264 A56 56 0 0 1 208 344 V248 A56 56 0 0 1 264 192 Z"/>
  </g>
</svg>
