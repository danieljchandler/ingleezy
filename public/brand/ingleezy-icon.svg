<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ingleezy">
  <!--
    The Ingleezy app icon: the wordmark's first letter on a Firoza tile.

    The wordmark is "ıngleezy" with the i's dot lifted off and set in gold, so
    the icon is that one letter: a white bar and a gold dot. Gold is the
    brand's highlighter and the dot is the only coloured thing in the mark.

    Flat fills only. This file is the favicon, and a gradient at 16px is mud;
    the in-app wordmark carries the lit sphere instead. Check any edit at 16px
    (scripts/render-brand-icons.mjs renders the PNG sizes).

    Colours: Firoza #13636C, Gold #E9AD20, white, matching the primary and
    accent tokens in src/index.css.

    Keep comment text free of doubled hyphens, which XML forbids inside a
    comment: browsers parse this file as XML when it is loaded through an img
    tag, and one stray pair makes the whole logo fail to render.
  -->
  <rect width="512" height="512" rx="120" fill="#13636C"/>
  <circle cx="256" cy="150" r="48" fill="#E9AD20"/>
  <rect x="219" y="224" width="74" height="188" rx="8" fill="#FFFFFF"/>
</svg>
