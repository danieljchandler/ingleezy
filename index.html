<!doctype html>
<!-- Arabic-first: the app chrome speaks the learner's language and lays out
     right-to-left. English CONTENT blocks opt back out via .font-english
     (direction:ltr + bidi isolation) and per-element dir attributes. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F5" />
    <meta name="theme-color" content="#0E181B" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Ingleezy — اتعلم إنجليزي حقيقي</title>
    <meta name="description" content="اتعلم الإنجليزي اللي الناس بتتكلمه فعلاً — فيديوهات حقيقية، بطاقات ذكية، وتصحيح نطق بالذكاء الاصطناعي، مصمم خصيصاً للناطقين بالعربية." />
    <meta name="author" content="Ingleezy" />

    <meta property="og:title" content="Ingleezy — English for Arabic speakers" />
    <meta property="og:description" content="اتعلم إنجليزي حقيقي من فيديوهات حقيقية — مع شرح بلهجتك وبالفصحى. مصمم للناطقين بالعربية." />
    <meta property="og:type" content="website" />
    <!-- Made absolute at build time from VITE_PUBLIC_SITE_URL (vite.config.ts);
         most link-preview crawlers ignore a relative image URL. -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ingleezy — إنجليزي محكي حقيقي، كلمة كلمة." />
    <meta property="og:site_name" content="Ingleezy" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ingleezy — English for Arabic speakers" />
    <meta name="twitter:description" content="اتعلم إنجليزي حقيقي من فيديوهات حقيقية — مصمم للناطقين بالعربية." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- The four font files every first screen draws with: the interface face
         (Latin), the Arabic interface face at regular and semibold, and the
         Arabic headline serif. Preloaded so text does not render in a fallback
         and then jump. The rest load on demand by unicode-range (src/fonts.css). -->
    <link rel="preload" href="/fonts/v1/funnel-sans-300-800-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/v1/ibm-plex-sans-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/v1/ibm-plex-sans-arabic-600-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/v1/noto-naskh-arabic-400-700-arabic.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/brand/ingleezy-icon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Ingleezy",
      "description": "Learn real spoken English — built for Arabic speakers, with scaffolding in your dialect and Fusha.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
